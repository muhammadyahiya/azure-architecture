# Lint, test, and build+push both container images on every push touching src/.
# app-cd.yml (separate workflow) rolls the new image out to Container Apps —
# kept separate so you can re-run a deploy without rebuilding, and vice versa.
name: app-ci

on:
  pull_request:
    paths: ["src/**"]
  push:
    branches: [main]
    paths: ["src/**"]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}  # e.g. acrmyragappdev — from `az deployment sub show` output

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install ruff pytest -r src/processing_worker/requirements.txt -r src/rag_api/requirements.txt

      - name: Lint
        run: ruff check src/

      - name: Test
        run: pytest src/ -q

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [processing_worker, rag_api]
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push (ACR Tasks — no local Docker daemon, no registry credentials)
        run: |
          IMAGE_NAME=$(echo ${{ matrix.service }} | tr '_' '-')
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${IMAGE_NAME}:${{ github.sha }} \
            --image ${IMAGE_NAME}:latest \
            --file src/${{ matrix.service }}/Dockerfile \
            src/
